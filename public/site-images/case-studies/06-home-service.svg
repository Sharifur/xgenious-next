<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#DDD3EC"/>

  <!-- Decorative blobs -->
  <circle cx="540" cy="60" r="80" fill="#C6B7E0" opacity="0.55"/>
  <circle cx="60" cy="350" r="100" fill="#CBBEE3" opacity="0.5"/>

  <!-- Map background (left side) -->
  <g transform="translate(40, 50)">
    <rect x="3" y="6" width="280" height="300" rx="16" fill="#000" opacity="0.1"/>
    <rect width="280" height="300" rx="16" fill="#F5F1FB"/>

    <!-- Map roads -->
    <g stroke="#D6CCEB" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M0 80 Q70 70 140 90 Q210 110 280 95"/>
      <path d="M0 180 Q90 175 160 200 Q220 220 280 205"/>
      <path d="M50 0 Q70 80 60 160 Q50 240 70 300"/>
      <path d="M200 0 Q210 90 195 180 Q180 260 200 300"/>
    </g>
    <g stroke="#E8DFF5" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 130 L280 140"/>
      <path d="M120 0 L130 300"/>
      <path d="M0 240 Q140 245 280 235"/>
    </g>

    <!-- Map blocks -->
    <rect x="20" y="20" width="35" height="40" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="85" y="30" width="30" height="30" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="170" y="20" width="40" height="45" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="235" y="40" width="30" height="30" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="20" y="145" width="40" height="25" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="75" y="155" width="35" height="35" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="155" y="150" width="40" height="30" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="230" y="155" width="35" height="35" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="30" y="260" width="40" height="30" rx="3" fill="#E8DFF5" opacity="0.7"/>
    <rect x="155" y="255" width="50" height="35" rx="3" fill="#E8DFF5" opacity="0.7"/>

    <!-- Map title -->
    <rect x="16" y="16" width="86" height="22" rx="11" fill="#FFFFFF"/>
    <circle cx="28" cy="27" r="4" fill="#7C3AED"/>
    <text x="38" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#5B21B6">Google Maps</text>

    <!-- User location (center) -->
    <g transform="translate(135, 135)">
      <circle r="22" fill="#7C3AED" opacity="0.2"/>
      <circle r="14" fill="#7C3AED" opacity="0.3"/>
      <circle r="8" fill="#7C3AED"/>
      <circle r="3" fill="#FFFFFF"/>
      <text x="0" y="-30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#5B21B6">YOU</text>
    </g>

    <!-- Provider pin 1 - Handyman -->
    <g transform="translate(60, 80)">
      <path d="M0 -22 C-10 -22 -16 -16 -16 -8 C-16 2 0 14 0 14 C0 14 16 2 16 -8 C16 -16 10 -22 0 -22 Z" fill="#F97316"/>
      <circle cx="0" cy="-10" r="7" fill="#FFFFFF"/>
      <!-- Wrench icon -->
      <path d="M-4 -13 L-2 -11 L2 -7 L4 -9 M-4 -13 L-2 -11 M-3 -7 L1 -3" stroke="#F97316" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <circle cx="-3" cy="-13" r="1.5" fill="#F97316"/>
    </g>

    <!-- Provider pin 2 - Cleaner -->
    <g transform="translate(210, 100)">
      <path d="M0 -22 C-10 -22 -16 -16 -16 -8 C-16 2 0 14 0 14 C0 14 16 2 16 -8 C16 -16 10 -22 0 -22 Z" fill="#06B6D4"/>
      <circle cx="0" cy="-10" r="7" fill="#FFFFFF"/>
      <!-- Spray bottle -->
      <rect x="-2" y="-14" width="4" height="6" rx="0.5" fill="#06B6D4"/>
      <rect x="-3" y="-9" width="6" height="4" rx="1" fill="#06B6D4"/>
    </g>

    <!-- Provider pin 3 - Painter -->
    <g transform="translate(80, 210)">
      <path d="M0 -22 C-10 -22 -16 -16 -16 -8 C-16 2 0 14 0 14 C0 14 16 2 16 -8 C16 -16 10 -22 0 -22 Z" fill="#EC4899"/>
      <circle cx="0" cy="-10" r="7" fill="#FFFFFF"/>
      <!-- Paint brush -->
      <rect x="-3" y="-14" width="6" height="3" rx="1" fill="#EC4899"/>
      <rect x="-1" y="-11" width="2" height="6" fill="#EC4899"/>
    </g>

    <!-- Provider pin 4 - Electrician -->
    <g transform="translate(215, 220)">
      <path d="M0 -22 C-10 -22 -16 -16 -16 -8 C-16 2 0 14 0 14 C0 14 16 2 16 -8 C16 -16 10 -22 0 -22 Z" fill="#F59E0B"/>
      <circle cx="0" cy="-10" r="7" fill="#FFFFFF"/>
      <!-- Lightning bolt -->
      <path d="M1 -14 L-2 -10 L0 -10 L-1 -7 L2 -11 L0 -11 Z" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Right side - Service card stack -->
  <g transform="translate(345, 50)">

    <!-- Header -->
    <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#5B21B6">NEARBY HANDYMEN</text>

    <!-- Featured handyman card -->
    <g transform="translate(0, 24)">
      <rect x="4" y="6" width="220" height="120" rx="14" fill="#000" opacity="0.1"/>
      <rect width="220" height="120" rx="14" fill="#FFFFFF"/>

      <!-- Avatar with toolbelt -->
      <circle cx="36" cy="36" r="22" fill="#D4A574"/>
      <!-- Face -->
      <circle cx="36" cy="32" r="9" fill="#FCD9B6"/>
      <!-- Hat/cap -->
      <path d="M27 26 Q27 20 36 20 Q45 20 45 26 L46 28 L26 28 Z" fill="#F97316"/>
      <!-- Body / overalls -->
      <path d="M20 58 Q20 44 36 44 Q52 44 52 58 L52 60 L20 60 Z" fill="#F97316"/>
      <!-- Toolbelt -->
      <rect x="22" y="51" width="28" height="4" fill="#7C2D12"/>
      <rect x="26" y="49" width="3" height="8" fill="#FCD34D"/>
      <rect x="32" y="49" width="3" height="8" fill="#FCD34D"/>
      <!-- Online -->
      <circle cx="53" cy="53" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

      <!-- Name & rating -->
      <text x="70" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1F2937">Jake Thompson</text>
      <text x="70" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280">Handyman • 0.6 mi away</text>
      <g transform="translate(70, 48)">
        <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#F59E0B">★ 4.9</text>
        <text x="28" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280">(284 jobs)</text>
        <rect x="100" y="0" width="44" height="14" rx="7" fill="#DCFCE7"/>
        <text x="122" y="10" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#15803D">● Available</text>
      </g>

      <!-- Services pills -->
      <g transform="translate(14, 74)">
        <rect width="56" height="18" rx="9" fill="#F3F4F6"/>
        <text x="28" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#374151">🔧 Plumbing</text>

        <rect x="62" width="58" height="18" rx="9" fill="#F3F4F6"/>
        <text x="91" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#374151">⚡ Electric</text>

        <rect x="124" width="52" height="18" rx="9" fill="#F3F4F6"/>
        <text x="150" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#374151">🔨 Repair</text>
      </g>

      <!-- Book button -->
      <rect x="14" y="98" width="100" height="14" rx="7" fill="#7C3AED"/>
      <text x="64" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Book Now</text>
      <text x="130" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1F2937">$45/hr</text>
    </g>

    <!-- WhatsApp notification -->
    <g transform="translate(0, 158)">
      <rect x="4" y="6" width="220" height="56" rx="12" fill="#000" opacity="0.1"/>
      <rect width="220" height="56" rx="12" fill="#25D366"/>
      <!-- WhatsApp icon -->
      <circle cx="28" cy="28" r="16" fill="#FFFFFF"/>
      <path d="M22 22 Q22 20 24 20 L26 20 Q27 20 27 22 L28 25 Q28 26 27 27 L26 28 Q27 30 30 32 L31 31 Q32 30 33 30 L35 31 Q36 31 36 32 L36 34 Q36 36 34 36 Q26 36 22 28 Z" fill="#25D366"/>
      <text x="54" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">WhatsApp Order Update</text>
      <text x="54" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.95">Jake is on the way • ETA 12 min</text>
    </g>

    <!-- Multi-service cart -->
    <g transform="translate(0, 224)">
      <rect x="4" y="6" width="220" height="84" rx="12" fill="#000" opacity="0.1"/>
      <rect width="220" height="84" rx="12" fill="#FFFFFF"/>

      <!-- Cart icon -->
      <g transform="translate(16, 16)">
        <circle cx="14" cy="14" r="14" fill="#FEF3C7"/>
        <path d="M7 8 L9 8 L11 17 L20 17 L22 11 L11 11" stroke="#92400E" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
        <circle cx="13" cy="20" r="1.5" fill="#92400E"/>
        <circle cx="18" cy="20" r="1.5" fill="#92400E"/>
      </g>

      <text x="56" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1F2937">Multi-Service Cart</text>
      <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280">3 services bundled</text>

      <!-- Line items -->
      <line x1="14" y1="50" x2="206" y2="50" stroke="#F3F4F6"/>
      <text x="14" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280">Plumbing repair</text>
      <text x="206" y="62" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1F2937">$45</text>
      <text x="14" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280">Deep clean (3hr)</text>
      <text x="206" y="74" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1F2937">$120</text>
    </g>
  </g>
</svg>
