<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#F0D9C7"/>

  <!-- Decorative blobs -->
  <circle cx="60" cy="70" r="80" fill="#E5C2A8" opacity="0.55"/>
  <circle cx="540" cy="340" r="100" fill="#E8C8B0" opacity="0.5"/>

  <!-- Left: Product page / storefront -->
  <g transform="translate(35, 40)">
    <rect x="4" y="6" width="260" height="320" rx="16" fill="#000" opacity="0.1"/>
    <rect width="260" height="320" rx="16" fill="#FFFFFF"/>

    <!-- Browser top -->
    <rect width="260" height="30" rx="16" fill="#FEF0E2"/>
    <rect y="14" width="260" height="16" fill="#FEF0E2"/>
    <circle cx="14" cy="15" r="3.5" fill="#EF4444"/>
    <circle cx="26" cy="15" r="3.5" fill="#F59E0B"/>
    <circle cx="38" cy="15" r="3.5" fill="#10B981"/>
    <rect x="52" y="9" width="170" height="12" rx="6" fill="#FFFFFF"/>
    <text x="60" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#92400E">🔒 shop.example.com</text>

    <!-- Language selector -->
    <g transform="translate(14, 40)">
      <rect width="62" height="20" rx="10" fill="#FEF3E2"/>
      <text x="10" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="9">🌐</text>
      <text x="26" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#92400E">EN ▾</text>
    </g>
    <!-- Currency selector -->
    <g transform="translate(82, 40)">
      <rect width="62" height="20" rx="10" fill="#FEF3E2"/>
      <text x="10" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#92400E">$ USD ▾</text>
    </g>
    <!-- Cart -->
    <g transform="translate(212, 40)">
      <rect width="34" height="20" rx="10" fill="#92400E"/>
      <path d="M8 7 L10 7 L11 13 L19 13 L20 9 L11 9" stroke="#FFFFFF" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
      <circle cx="13" cy="15" r="1.2" fill="#FFFFFF"/>
      <circle cx="18" cy="15" r="1.2" fill="#FFFFFF"/>
      <circle cx="26" cy="9" r="5" fill="#EF4444"/>
      <text x="26" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF">3</text>
    </g>

    <!-- Product hero -->
    <rect x="14" y="68" width="232" height="120" rx="10" fill="#FEF3E2"/>
    <!-- Sneaker illustration -->
    <g transform="translate(50, 100)">
      <!-- Sole -->
      <path d="M0 60 L0 50 Q5 42 18 42 L120 42 Q140 42 155 50 L160 60 Z" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
      <!-- Body -->
      <path d="M20 42 Q22 30 35 28 L75 28 Q90 30 100 35 L140 38 Q150 40 155 50 L20 50 Z" fill="#EA580C"/>
      <!-- Stripes -->
      <path d="M40 42 L50 30 M55 42 L65 30 M70 42 L80 30" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- Laces -->
      <line x1="35" y1="32" x2="85" y2="32" stroke="#1F2937" stroke-width="1.2"/>
      <line x1="38" y1="36" x2="82" y2="36" stroke="#1F2937" stroke-width="1.2"/>
      <!-- Heel -->
      <path d="M20 42 Q22 30 35 28 L40 28 L40 42 Z" fill="#C2410C"/>
    </g>
    <!-- Discount badge -->
    <g transform="translate(22, 76)">
      <rect width="40" height="18" rx="9" fill="#EF4444"/>
      <text x="20" y="12" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF">-25%</text>
    </g>

    <!-- Product info -->
    <text x="14" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1F2937">Urban Runner Pro</text>
    <g transform="translate(14, 212)">
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#EA580C">$89</text>
      <text x="38" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9CA3AF" text-decoration="line-through">$119</text>
    </g>

    <!-- Variant matrix label -->
    <text x="14" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#92400E">VARIANT MATRIX</text>

    <!-- Color swatches -->
    <g transform="translate(14, 252)">
      <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B7280">Color</text>
      <circle cx="38" cy="7" r="8" fill="#EA580C" stroke="#1F2937" stroke-width="2"/>
      <circle cx="58" cy="7" r="8" fill="#1E40AF"/>
      <circle cx="78" cy="7" r="8" fill="#1F2937"/>
      <circle cx="98" cy="7" r="8" fill="#10B981"/>
      <circle cx="118" cy="7" r="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    </g>

    <!-- Size grid -->
    <g transform="translate(14, 272)">
      <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B7280">Size</text>
      <rect x="28" width="22" height="16" rx="3" fill="#FEF3E2"/>
      <text x="39" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#92400E">7</text>
      <rect x="54" width="22" height="16" rx="3" fill="#FEF3E2"/>
      <text x="65" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#92400E">8</text>
      <rect x="80" width="22" height="16" rx="3" fill="#92400E"/>
      <text x="91" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">9</text>
      <rect x="106" width="22" height="16" rx="3" fill="#FEF3E2"/>
      <text x="117" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#92400E">10</text>
      <rect x="132" width="22" height="16" rx="3" fill="#FEF3E2"/>
      <text x="143" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#92400E">11</text>
      <rect x="158" width="38" height="16" rx="3" fill="#F3F4F6"/>
      <text x="177" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#9CA3AF">+12 more</text>
    </g>

    <!-- Fraud detection bar -->
    <g transform="translate(14, 298)">
      <rect width="232" height="16" rx="8" fill="#DCFCE7"/>
      <circle cx="14" cy="8" r="5" fill="#15803D"/>
      <path d="M11 8 L13 10 L17 6" stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#15803D">Fraud check passed • Order verified</text>
    </g>
