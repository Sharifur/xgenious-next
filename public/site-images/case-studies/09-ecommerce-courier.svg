      <rect y="24" width="245" height="14" fill="#1F2937"/>
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#FBBF24">📦 SHIP•LABEL</text>
      <text x="14" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#9CA3AF">Auto-generated • EXPRESS</text>
      <rect x="190" y="11" width="45" height="18" rx="3" fill="#FBBF24"/>
      <text x="212" y="23" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#1F2937">PRIORITY</text>

      <!-- FROM/TO -->
      <text x="14" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#9CA3AF">FROM</text>
      <text x="14" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1F2937">Urban Runner Store</text>
      <text x="14" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B7280">123 Market St, Dhaka</text>

      <text x="135" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#9CA3AF">TO</text>
      <text x="135" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1F2937">Maria Garcia</text>
      <text x="135" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B7280">42 Calle Mayor, Madrid</text>

      <!-- Dashed divider -->
      <line x1="14" y1="92" x2="231" y2="92" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Barcode -->
      <g transform="translate(14, 100)">
        <g fill="#1F2937">
          <rect x="0" y="0" width="2" height="40"/>
          <rect x="4" y="0" width="1" height="40"/>
          <rect x="7" y="0" width="3" height="40"/>
          <rect x="12" y="0" width="1" height="40"/>
          <rect x="15" y="0" width="2" height="40"/>
          <rect x="19" y="0" width="3" height="40"/>
          <rect x="24" y="0" width="1" height="40"/>
          <rect x="27" y="0" width="2" height="40"/>
          <rect x="31" y="0" width="1" height="40"/>
          <rect x="34" y="0" width="3" height="40"/>
          <rect x="39" y="0" width="2" height="40"/>
          <rect x="43" y="0" width="1" height="40"/>
          <rect x="46" y="0" width="2" height="40"/>
          <rect x="50" y="0" width="3" height="40"/>
          <rect x="55" y="0" width="1" height="40"/>
          <rect x="58" y="0" width="2" height="40"/>
          <rect x="62" y="0" width="3" height="40"/>
          <rect x="67" y="0" width="1" height="40"/>
          <rect x="70" y="0" width="2" height="40"/>
          <rect x="74" y="0" width="1" height="40"/>
          <rect x="77" y="0" width="3" height="40"/>
          <rect x="82" y="0" width="2" height="40"/>
          <rect x="86" y="0" width="1" height="40"/>
          <rect x="89" y="0" width="3" height="40"/>
          <rect x="94" y="0" width="1" height="40"/>
          <rect x="97" y="0" width="2" height="40"/>
          <rect x="101" y="0" width="3" height="40"/>
          <rect x="106" y="0" width="1" height="40"/>
          <rect x="109" y="0" width="2" height="40"/>
          <rect x="113" y="0" width="1" height="40"/>
          <rect x="116" y="0" width="3" height="40"/>
          <rect x="121" y="0" width="2" height="40"/>
          <rect x="125" y="0" width="1" height="40"/>
          <rect x="128" y="0" width="2" height="40"/>
        </g>
        <text x="66" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#1F2937">SH-2026-EX-8421</text>
      </g>

      <!-- QR code -->
      <g transform="translate(155, 100)">
        <rect width="50" height="50" rx="4" fill="#1F2937"/>
        <!-- QR pattern -->
        <g fill="#FFFFFF">
          <rect x="4" y="4" width="12" height="12"/>
          <rect x="34" y="4" width="12" height="12"/>
          <rect x="4" y="34" width="12" height="12"/>
          <rect x="22" y="22" width="6" height="6"/>
          <rect x="20" y="14" width="4" height="4"/>
          <rect x="28" y="20" width="4" height="4"/>
          <rect x="14" y="22" width="4" height="4"/>
          <rect x="32" y="32" width="4" height="4"/>
          <rect x="38" y="24" width="4" height="4"/>
          <rect x="24" y="34" width="4" height="4"/>
          <rect x="32" y="40" width="4" height="4"/>
          <rect x="40" y="36" width="4" height="4"/>
          <rect x="20" y="40" width="4" height="4"/>
        </g>
        <g fill="#1F2937">
          <rect x="7" y="7" width="6" height="6"/>
          <rect x="37" y="7" width="6" height="6"/>
          <rect x="7" y="37" width="6" height="6"/>
        </g>
      </g>

      <!-- Weight + Service -->
      <g transform="translate(155, 158)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#6B7280">WEIGHT</text>
        <text x="0" y="11" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1F2937">1.2 kg</text>
      </g>

      <!-- Order ID footer -->
      <text x="14" y="180" font-family="ui-monospace, monospace" font-size="7" fill="#9CA3AF">ORDER #UR-2026-08421 • Generated 2 min ago</text>
    </g>

    <!-- Courier provider chips -->
    <g transform="translate(0, 240)">
      <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#92400E">INTEGRATED COURIERS</text>
      <g transform="translate(0, 16)">
        <rect width="50" height="22" rx="4" fill="#FFCC00"/>
        <text x="25" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#1F2937">DHL</text>

        <rect x="56" width="50" height="22" rx="4" fill="#FF6200"/>
        <text x="81" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF">FedEx</text>

        <rect x="112" width="50" height="22" rx="4" fill="#341B14"/>
        <text x="137" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#FFB500">UPS</text>

        <rect x="168" width="50" height="22" rx="4" fill="#004B93"/>
        <text x="193" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" fill="#FFFFFF">USPS</text>

        <rect x="224" width="22" height="22" rx="4" fill="#1F2937"/>
        <text x="235" y="15" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#FBBF24">+8</text>
      </g>
    </g>

    <!-- Multi-currency strip -->
    <g transform="translate(0, 296)">
      <rect width="246" height="32" rx="10" fill="#1F2937"/>
      <text x="12" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#FBBF24">MULTI-CURRENCY CHECKOUT</text>
      <g font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">
        <text x="12" y="27">$ USD</text>
        <text x="54" y="27">€ EUR</text>
        <text x="94" y="27">£ GBP</text>
        <text x="134" y="27">¥ JPY</text>
        <text x="172" y="27">₹ INR</text>
        <text x="212" y="27">+22</text>
      </g>
