  <!-- Right: Courier label & shipping panel -->
  <g transform="translate(320, 40)">
    <!-- Multi-language pill at top -->
    <g transform="translate(0, 0)">
      <rect width="245" height="22" rx="11" fill="#FFFFFF"/>
      <text x="12" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#92400E">🌍 MULTI-LANGUAGE STOREFRONT</text>
      <rect x="170" y="4" width="22" height="14" rx="3" fill="#FEF3E2"/>
      <text x="181" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#92400E">EN</text>
      <rect x="194" y="4" width="22" height="14" rx="3" fill="#FEF3E2"/>
      <text x="205" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#92400E">ES</text>
      <rect x="218" y="4" width="22" height="14" rx="3" fill="#FEF3E2"/>
      <text x="229" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#92400E">FR</text>
