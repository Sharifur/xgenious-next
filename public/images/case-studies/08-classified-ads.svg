<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#C6CFE8"/>

  <!-- Decorative blobs -->
  <circle cx="60" cy="70" r="85" fill="#A8B5D6" opacity="0.5"/>
  <circle cx="540" cy="350" r="100" fill="#B3BFDD" opacity="0.5"/>

  <!-- Left: Listings browser -->
  <g transform="translate(35, 40)">
    <!-- Shadow -->
    <rect x="4" y="6" width="280" height="320" rx="16" fill="#000" opacity="0.1"/>
    <rect width="280" height="320" rx="16" fill="#FFFFFF"/>

    <!-- Browser top -->
    <rect width="280" height="34" rx="16" fill="#F1F5F9"/>
    <rect y="18" width="280" height="16" fill="#F1F5F9"/>
    <circle cx="16" cy="17" r="4" fill="#EF4444"/>
    <circle cx="30" cy="17" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="17" r="4" fill="#10B981"/>
    <!-- URL bar -->
    <rect x="58" y="10" width="180" height="14" rx="7" fill="#FFFFFF"/>
    <text x="68" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#64748B">🔒 classifieds.example.com</text>

    <!-- Page header with location -->
    <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Browse Listings</text>
    <g transform="translate(14, 66)">
      <rect width="100" height="18" rx="9" fill="#EFF6FF"/>
      <circle cx="12" cy="9" r="3.5" fill="#3B82F6"/>
      <circle cx="12" cy="9" r="1.5" fill="#FFFFFF"/>
      <text x="22" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#1E40AF">Dhaka, BD • 5km</text>
    </g>
    <!-- Brands count -->
    <g transform="translate(180, 64)">
      <text x="0" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#1E40AF">2K+ brands</text>
      <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">verified sellers</text>
    </g>

    <!-- Category pills -->
    <g transform="translate(14, 92)">
      <rect width="48" height="20" rx="10" fill="#1E293B"/>
      <text x="24" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">All</text>
      <rect x="54" width="58" height="20" rx="10" fill="#F1F5F9"/>
      <text x="83" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#475569">Vehicles</text>
      <rect x="118" width="50" height="20" rx="10" fill="#F1F5F9"/>
      <text x="143" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#475569">Phones</text>
      <rect x="174" width="56" height="20" rx="10" fill="#F1F5F9"/>
      <text x="202" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#475569">Realty</text>
      <rect x="236" width="30" height="20" rx="10" fill="#F1F5F9"/>
      <text x="251" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#475569">+8</text>
    </g>

    <!-- Listing grid -->
    <!-- Card 1 -->
    <g transform="translate(14, 122)">
      <rect width="125" height="86" rx="10" fill="#F8FAFC"/>
      <rect width="125" height="50" rx="10" fill="#DBEAFE"/>
      <rect y="40" width="125" height="10" fill="#DBEAFE"/>
      <!-- Car illustration -->
      <g transform="translate(20, 12)">
        <path d="M4 28 L10 18 Q14 12 22 12 L62 12 Q70 12 74 18 L82 26 Q86 28 86 32 L86 34 L4 34 Z" fill="#3B82F6"/>
        <path d="M14 20 Q18 16 22 16 L58 16 Q62 16 64 20 L66 26 L14 26 Z" fill="#1E40AF" opacity="0.5"/>
        <circle cx="22" cy="34" r="5" fill="#1F2937"/>
        <circle cx="68" cy="34" r="5" fill="#1F2937"/>
      </g>
      <!-- Featured badge -->
      <rect x="6" y="6" width="46" height="14" rx="3" fill="#FBBF24"/>
      <text x="29" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#78350F">FEATURED</text>
      <!-- Details -->
      <text x="8" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">Honda Civic '21</text>
      <text x="8" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#1E40AF">$14,500</text>
      <text x="60" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">📍 2.3km</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(143, 122)">
      <rect width="125" height="86" rx="10" fill="#F8FAFC"/>
      <rect width="125" height="50" rx="10" fill="#FEE2E2"/>
      <rect y="40" width="125" height="10" fill="#FEE2E2"/>
      <!-- Phone illustration -->
      <g transform="translate(48, 8)">
        <rect width="28" height="44" rx="4" fill="#1F2937"/>
        <rect x="2" y="4" width="24" height="36" rx="2" fill="#3B82F6"/>
        <circle cx="14" cy="42" r="1.5" fill="#FFFFFF"/>
      </g>
      <text x="8" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">iPhone 15 Pro</text>
      <text x="8" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#1E40AF">$980</text>
      <text x="60" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">📍 1.1km</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(14, 216)">
      <rect width="125" height="86" rx="10" fill="#F8FAFC"/>
      <rect width="125" height="50" rx="10" fill="#FEF3C7"/>
      <rect y="40" width="125" height="10" fill="#FEF3C7"/>
      <!-- House illustration -->
      <g transform="translate(38, 10)">
        <path d="M0 30 L24 8 L48 30 Z" fill="#F59E0B"/>
        <rect x="6" y="26" width="36" height="14" fill="#FBBF24"/>
        <rect x="20" y="32" width="8" height="8" fill="#92400E"/>
        <rect x="10" y="30" width="6" height="6" fill="#FEF3C7"/>
        <rect x="32" y="30" width="6" height="6" fill="#FEF3C7"/>
      </g>
      <text x="8" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">2BR Apartment</text>
      <text x="8" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#1E40AF">$450/mo</text>
      <text x="68" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">📍 0.8km</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(143, 216)">
      <rect width="125" height="86" rx="10" fill="#F8FAFC"/>
      <rect width="125" height="50" rx="10" fill="#D1FAE5"/>
      <rect y="40" width="125" height="10" fill="#D1FAE5"/>
      <!-- Bike illustration -->
      <g transform="translate(32, 18)">
        <circle cx="12" cy="22" r="10" fill="none" stroke="#059669" stroke-width="2"/>
        <circle cx="48" cy="22" r="10" fill="none" stroke="#059669" stroke-width="2"/>
        <path d="M12 22 L30 8 L48 22 M30 8 L30 18 L20 22" stroke="#059669" stroke-width="2" fill="none" stroke-linejoin="round"/>
      </g>
      <text x="8" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">Mountain Bike</text>
      <text x="8" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#1E40AF">$320</text>
      <text x="60" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#64748B">📍 3.5km</text>
    </g>
  </g>

  <!-- Right: Live chat panel -->
  <g transform="translate(355, 30)">
    <!-- Shadow -->
    <rect x="4" y="6" width="225" height="340" rx="18" fill="#000" opacity="0.12"/>
    <rect width="225" height="340" rx="18" fill="#FFFFFF"/>

    <!-- Chat header -->
    <rect width="225" height="60" rx="18" fill="#1E40AF"/>
    <rect y="42" width="225" height="18" fill="#1E40AF"/>
    <!-- Back arrow -->
    <path d="M14 28 L10 32 L14 36 M10 32 L22 32" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Seller avatar -->
    <circle cx="38" cy="32" r="14" fill="#FCD9B6"/>
    <path d="M30 26 Q30 19 38 19 Q46 19 46 26 L46 30 L30 30 Z" fill="#3D2817"/>
    <path d="M28 44 Q28 36 38 36 Q48 36 48 44" fill="#10B981"/>
    <circle cx="50" cy="42" r="3.5" fill="#10B981" stroke="#1E40AF" stroke-width="1.5"/>
    <!-- Name -->
    <text x="60" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Ahmed Hassan</text>
    <g transform="translate(60, 36)">
      <circle cx="4" cy="4" r="3" fill="#10B981"/>
      <text x="11" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#BFDBFE">Online • Typing...</text>
    </g>
    <!-- Verified seller badge -->
    <rect x="170" y="22" width="44" height="18" rx="9" fill="#FBBF24"/>
    <text x="192" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#78350F">✓ Pro</text>

    <!-- Listing preview pinned -->
    <g transform="translate(12, 70)">
      <rect width="201" height="44" rx="10" fill="#F8FAFC"/>
      <rect x="6" y="6" width="32" height="32" rx="6" fill="#DBEAFE"/>
      <!-- Mini car -->
      <g transform="translate(10, 16)">
        <path d="M2 14 L4 9 Q5 7 8 7 L20 7 Q23 7 24 9 L26 13 L2 13 Z" fill="#3B82F6"/>
        <circle cx="7" cy="14" r="2" fill="#1F2937"/>
        <circle cx="21" cy="14" r="2" fill="#1F2937"/>
      </g>
      <text x="44" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#0F172A">Honda Civic '21</text>
      <text x="44" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#1E40AF">$14,500</text>
      <text x="172" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#64748B">VIEW</text>
    </g>

    <!-- Chat messages -->
    <!-- Day divider -->
    <g transform="translate(0, 122)">
      <line x1="60" y1="6" x2="100" y2="6" stroke="#E2E8F0" stroke-width="1"/>
      <text x="112" y="9" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#94A3B8">Today</text>
      <line x1="125" y1="6" x2="165" y2="6" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Buyer message -->
    <g transform="translate(12, 134)">
      <rect width="140" height="32" rx="12" fill="#F1F5F9"/>
      <text x="10" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0F172A">Is this still available?</text>
      <text x="10" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#94A3B8">10:42 AM</text>
    </g>

    <!-- Seller message -->
    <g transform="translate(72, 174)">
      <rect width="140" height="32" rx="12" fill="#1E40AF"/>
      <text x="10" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#FFFFFF">Yes! Want to view it?</text>
      <text x="10" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#BFDBFE">10:43 AM ✓✓</text>
    </g>

    <!-- Buyer message -->
    <g transform="translate(12, 214)">
      <rect width="160" height="44" rx="12" fill="#F1F5F9"/>
      <text x="10" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0F172A">Yes! Can we meet tomorrow</text>
      <text x="10" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0F172A">at 3 PM near Gulshan?</text>
      <text x="10" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#94A3B8">10:43 AM</text>
    </g>

    <!-- Typing -->
    <g transform="translate(72, 266)">
      <rect width="56" height="24" rx="12" fill="#1E40AF"/>
      <circle cx="16" cy="12" r="3" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="28" cy="12" r="3" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="12" r="3" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Input bar -->
    <g transform="translate(12, 300)">
      <rect width="201" height="32" rx="16" fill="#F1F5F9"/>
      <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94A3B8">Type a message...</text>
      <circle cx="184" cy="16" r="11" fill="#1E40AF"/>
      <path d="M180 16 L188 12 L184 16 L188 20 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Live chat connection indicator -->
  <g transform="translate(312, 175)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#1E40AF" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="20" cy="0" r="6" fill="#10B981"/>
    <path d="M16 -1 L20 3 L24 -3" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Membership tier badge top-right -->
  <g transform="translate(355, 8)">
    <rect width="80" height="20" rx="10" fill="#FBBF24"/>
    <text x="40" y="13" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#78350F">★ PRO TIER</text>
  </g>

  <!-- Wallet icon (top of right panel) -->
  <g transform="translate(490, 8)">
    <rect width="86" height="20" rx="10" fill="#1E293B"/>
    <rect x="10" y="6" width="14" height="9" rx="1.5" fill="none" stroke="#FBBF24" stroke-width="1.4"/>
    <circle cx="21" cy="10" r="1.2" fill="#FBBF24"/>
    <text x="30" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">Wallet $245</text>
  </g>
</svg>
