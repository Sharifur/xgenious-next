<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#F0DDD0"/>

  <!-- Decorative blobs -->
  <circle cx="540" cy="60" r="80" fill="#E5C8B0" opacity="0.55"/>
  <circle cx="60" cy="350" r="100" fill="#E8D0BA" opacity="0.55"/>

  <!-- 3 storefronts -->
  <!-- Store 1 -->
  <g transform="translate(35, 80)">
    <rect x="3" y="6" width="160" height="170" rx="14" fill="#000" opacity="0.08"/>
    <rect width="160" height="170" rx="14" fill="#FFFFFF"/>
    <!-- Browser top -->
    <rect width="160" height="28" rx="14" fill="#F8E4D2"/>
    <rect y="14" width="160" height="14" fill="#F8E4D2"/>
    <circle cx="14" cy="14" r="3.5" fill="#FF6B6B"/>
    <circle cx="26" cy="14" r="3.5" fill="#FFD93D"/>
    <circle cx="38" cy="14" r="3.5" fill="#6BCB77"/>
    <rect x="50" y="9" width="100" height="10" rx="5" fill="#FFFFFF"/>
    <text x="58" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="6" fill="#A0826D">aurabeauty.store</text>

    <!-- Store content -->
    <rect x="12" y="40" width="136" height="58" rx="8" fill="#FCE7D6"/>
    <text x="22" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#92400E">AURA</text>
    <text x="22" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#A0826D">Premium skincare</text>
    <!-- Product circle -->
    <circle cx="120" cy="68" r="18" fill="#F0B68E"/>
    <rect x="113" y="56" width="14" height="22" rx="3" fill="#FFFFFF"/>
    <rect x="115" y="60" width="10" height="2" fill="#92400E"/>

    <!-- Product grid -->
    <rect x="12" y="108" width="40" height="40" rx="6" fill="#FDF0E6"/>
    <circle cx="32" cy="128" r="9" fill="#F0B68E"/>
    <rect x="58" y="108" width="40" height="40" rx="6" fill="#FDF0E6"/>
    <circle cx="78" cy="128" r="9" fill="#D4A574"/>
    <rect x="104" y="108" width="44" height="40" rx="6" fill="#FB923C"/>
    <text x="126" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">+24</text>

    <!-- Domain tag -->
    <rect x="12" y="154" width="136" height="12" rx="6" fill="#FEF3E2"/>
    <circle cx="20" cy="160" r="2.5" fill="#10B981"/>
    <text x="27" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#92400E">aurabeauty.store</text>
  </g>

  <!-- Store 2 (center, elevated) -->
  <g transform="translate(220, 60)">
    <rect x="3" y="6" width="160" height="170" rx="14" fill="#000" opacity="0.12"/>
    <rect width="160" height="170" rx="14" fill="#FFFFFF"/>
    <rect width="160" height="28" rx="14" fill="#E0E7FF"/>
    <rect y="14" width="160" height="14" fill="#E0E7FF"/>
    <circle cx="14" cy="14" r="3.5" fill="#FF6B6B"/>
    <circle cx="26" cy="14" r="3.5" fill="#FFD93D"/>
    <circle cx="38" cy="14" r="3.5" fill="#6BCB77"/>
    <rect x="50" y="9" width="100" height="10" rx="5" fill="#FFFFFF"/>
    <text x="58" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="6" fill="#6366F1">tech-haven.shop</text>

    <rect x="12" y="40" width="136" height="58" rx="8" fill="#EEF2FF"/>
    <text x="22" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#3730A3">TECH HAVEN</text>
    <text x="22" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#6366F1">Gadgets &amp; gear</text>
    <!-- Headphone icon -->
    <path d="M105 80 Q105 60 120 60 Q135 60 135 80" stroke="#3730A3" stroke-width="2.5" fill="none"/>
    <rect x="102" y="78" width="8" height="12" rx="2" fill="#3730A3"/>
    <rect x="130" y="78" width="8" height="12" rx="2" fill="#3730A3"/>

    <rect x="12" y="108" width="40" height="40" rx="6" fill="#EEF2FF"/>
    <rect x="22" y="118" width="20" height="20" rx="3" fill="#6366F1"/>
    <rect x="58" y="108" width="40" height="40" rx="6" fill="#EEF2FF"/>
    <circle cx="78" cy="128" r="10" fill="#818CF8"/>
    <rect x="104" y="108" width="44" height="40" rx="6" fill="#4F46E5"/>
    <text x="126" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">+58</text>

    <rect x="12" y="154" width="136" height="12" rx="6" fill="#EEF2FF"/>
    <circle cx="20" cy="160" r="2.5" fill="#10B981"/>
    <text x="27" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#3730A3">tech-haven.shop</text>
  </g>

  <!-- Store 3 -->
  <g transform="translate(405, 80)">
    <rect x="3" y="6" width="160" height="170" rx="14" fill="#000" opacity="0.08"/>
    <rect width="160" height="170" rx="14" fill="#FFFFFF"/>
    <rect width="160" height="28" rx="14" fill="#DCFCE7"/>
    <rect y="14" width="160" height="14" fill="#DCFCE7"/>
    <circle cx="14" cy="14" r="3.5" fill="#FF6B6B"/>
    <circle cx="26" cy="14" r="3.5" fill="#FFD93D"/>
    <circle cx="38" cy="14" r="3.5" fill="#6BCB77"/>
    <rect x="50" y="9" width="100" height="10" rx="5" fill="#FFFFFF"/>
    <text x="58" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="6" fill="#15803D">greens.market</text>

    <rect x="12" y="40" width="136" height="58" rx="8" fill="#ECFCCB"/>
    <text x="22" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#365314">GREENS</text>
    <text x="22" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#65A30D">Fresh produce</text>
    <!-- Leaf -->
    <path d="M120 60 Q105 70 110 88 Q130 78 130 60 Z" fill="#84CC16"/>
    <path d="M120 60 Q117 75 110 88" stroke="#365314" stroke-width="1" fill="none"/>

    <rect x="12" y="108" width="40" height="40" rx="6" fill="#F7FEE7"/>
    <circle cx="32" cy="128" r="9" fill="#84CC16"/>
    <rect x="58" y="108" width="40" height="40" rx="6" fill="#F7FEE7"/>
    <circle cx="78" cy="128" r="9" fill="#EA580C"/>
    <rect x="104" y="108" width="44" height="40" rx="6" fill="#65A30D"/>
    <text x="126" y="132" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">+32</text>

    <rect x="12" y="154" width="136" height="12" rx="6" fill="#ECFCCB"/>
    <circle cx="20" cy="160" r="2.5" fill="#10B981"/>
    <text x="27" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="600" fill="#365314">greens.market</text>
  </g>

  <!-- Bottom platform bar (single Laravel instance) -->
  <g transform="translate(30, 305)">
    <rect x="3" y="4" width="540" height="68" rx="14" fill="#000" opacity="0.1"/>
    <rect width="540" height="68" rx="14" fill="#1E1B2E"/>
    <!-- Server icon -->
    <rect x="20" y="18" width="34" height="32" rx="4" fill="#3D3458"/>
    <rect x="24" y="22" width="26" height="6" rx="1" fill="#A78BFA"/>
    <circle cx="46" cy="26" r="1.5" fill="#10B981"/>
    <rect x="24" y="32" width="26" height="6" rx="1" fill="#3D3458"/>
    <circle cx="46" cy="36" r="1.5" fill="#FBBF24"/>
    <rect x="24" y="42" width="26" height="6" rx="1" fill="#3D3458"/>
    <circle cx="46" cy="46" r="1.5" fill="#10B981"/>

    <text x="68" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">One Laravel Instance</text>
    <text x="68" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#A78BFA">50+ tenant stores • per-tenant branding</text>

    <!-- Payment badges -->
    <g transform="translate(230, 22)">
      <text x="0" y="-2" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#A78BFA">19+ PAYMENT GATEWAYS</text>
      <rect x="0" y="4" width="36" height="22" rx="4" fill="#635BFF"/>
      <text x="18" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF">stripe</text>

      <rect x="42" y="4" width="36" height="22" rx="4" fill="#003087"/>
      <text x="60" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" font-style="italic">PayPal</text>

      <rect x="84" y="4" width="36" height="22" rx="4" fill="#FFFFFF"/>
      <text x="102" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#1A1F71">VISA</text>

      <rect x="126" y="4" width="36" height="22" rx="4" fill="#FFFFFF"/>
      <circle cx="138" cy="15" r="6" fill="#EB001B" opacity="0.9"/>
      <circle cx="148" cy="15" r="6" fill="#F79E1B" opacity="0.9"/>

      <rect x="168" y="4" width="36" height="22" rx="4" fill="#2D3748"/>
      <text x="186" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF">Apple Pay</text>

      <rect x="210" y="4" width="36" height="22" rx="4" fill="#4285F4"/>
      <text x="228" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF">G Pay</text>

      <rect x="252" y="4" width="36" height="22" rx="4" fill="#3D3458"/>
      <text x="270" y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#A78BFA">+13</text>
    </g>
  </g>

  <!-- Connecting lines from stores down to platform -->
  <g stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7">
    <line x1="115" y1="250" x2="115" y2="305"/>
    <line x1="300" y1="230" x2="300" y2="305"/>
    <line x1="485" y1="250" x2="485" y2="305"/>
  </g>

  <!-- Top title pill -->
  <g transform="translate(225, 22)">
    <rect width="150" height="26" rx="13" fill="#FFFFFF" stroke="#E5C8B0" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#92400E"/>
    <text x="24" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400E">Multi-Tenant Stores</text>
  </g>
</svg>
