<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#DEDDD0"/>

  <!-- Decorative blobs -->
  <circle cx="540" cy="60" r="80" fill="#C5C4B5" opacity="0.55"/>
  <circle cx="60" cy="350" r="100" fill="#CECDBD" opacity="0.5"/>

  <!-- Garage scene (left) -->
  <g transform="translate(35, 70)">
    <!-- Shadow -->
    <rect x="4" y="6" width="280" height="220" rx="16" fill="#000" opacity="0.1"/>
    <rect width="280" height="220" rx="16" fill="#F5F4ED"/>

    <!-- Garage floor -->
    <rect y="150" width="280" height="70" fill="#9CA38D" opacity="0.4"/>
    <!-- Floor stripes -->
    <line x1="0" y1="170" x2="280" y2="170" stroke="#7A8273" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>

    <!-- Back wall with tools -->
    <rect x="20" y="20" width="120" height="60" rx="4" fill="#E8E5D8"/>
    <!-- Pegboard tools -->
    <circle cx="40" cy="35" r="2" fill="#5A6258"/>
    <circle cx="60" cy="35" r="2" fill="#5A6258"/>
    <circle cx="80" cy="35" r="2" fill="#5A6258"/>
    <circle cx="100" cy="35" r="2" fill="#5A6258"/>
    <circle cx="120" cy="35" r="2" fill="#5A6258"/>
    <!-- Wrench -->
    <path d="M35 45 L35 60 L40 60 L40 50 L48 50 L48 45 Z" fill="#5A6258"/>
    <!-- Screwdriver -->
    <rect x="58" y="45" width="3" height="18" fill="#D4A574"/>
    <rect x="55" y="40" width="9" height="6" rx="1" fill="#DC2626"/>
    <!-- Hammer -->
    <rect x="78" y="48" width="3" height="20" fill="#7A4A1F"/>
    <rect x="73" y="44" width="13" height="8" rx="1" fill="#5A6258"/>
    <!-- Pliers -->
    <path d="M100 45 L103 55 L100 65 M106 45 L103 55 L106 65" stroke="#5A6258" stroke-width="2" fill="none"/>

    <!-- Sign "AUTO" -->
    <rect x="160" y="25" width="100" height="40" rx="6" fill="#1F2937"/>
    <text x="210" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FBBF24">AUTO</text>
    <text x="210" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">SERVICE</text>

    <!-- The car (side view) -->
    <g transform="translate(40, 90)">
      <!-- Body -->
      <path d="M10 50 L20 25 Q24 18 32 18 L130 18 Q138 18 144 25 L165 35 Q180 38 185 45 L185 60 L10 60 Z" fill="#3B82F6"/>
      <!-- Roof highlight -->
      <path d="M22 28 Q26 22 32 22 L120 22 Q126 22 130 28 L130 36 L22 36 Z" fill="#60A5FA" opacity="0.6"/>
      <!-- Windows -->
      <path d="M40 25 L55 38 L100 38 L100 25 Z" fill="#1E293B" opacity="0.7"/>
      <path d="M105 25 L105 38 L140 38 L130 25 Z" fill="#1E293B" opacity="0.7"/>
      <!-- Door line -->
      <line x1="100" y1="25" x2="100" y2="55" stroke="#1E40AF" stroke-width="1.2"/>
      <!-- Door handle -->
      <rect x="80" y="45" width="10" height="2" rx="1" fill="#1E40AF"/>
      <!-- Headlight -->
      <ellipse cx="178" cy="48" rx="6" ry="4" fill="#FCD34D"/>
      <!-- Wheels -->
      <circle cx="45" cy="60" r="14" fill="#1F2937"/>
      <circle cx="45" cy="60" r="6" fill="#6B7280"/>
      <circle cx="155" cy="60" r="14" fill="#1F2937"/>
      <circle cx="155" cy="60" r="6" fill="#6B7280"/>
    </g>

    <!-- Mechanic figure -->
    <g transform="translate(220, 100)">
      <!-- Head -->
      <circle cx="14" cy="18" r="9" fill="#FCD9B6"/>
      <!-- Cap -->
      <path d="M5 16 Q5 8 14 8 Q23 8 23 16 L24 18 L4 18 Z" fill="#1E40AF"/>
      <rect x="3" y="17" width="22" height="3" fill="#1E40AF"/>
      <!-- Body (overalls) -->
      <path d="M2 60 Q2 35 14 32 Q26 35 26 60 L26 70 L2 70 Z" fill="#1E40AF"/>
      <!-- Suspender lines -->
      <line x1="10" y1="34" x2="10" y2="50" stroke="#1E3A8A" stroke-width="1"/>
      <line x1="18" y1="34" x2="18" y2="50" stroke="#1E3A8A" stroke-width="1"/>
      <!-- Pocket -->
      <rect x="10" y="45" width="8" height="6" rx="1" fill="#1E3A8A"/>
      <!-- Wrench in hand -->
      <rect x="22" y="40" width="14" height="3" rx="1" fill="#5A6258" transform="rotate(20 29 41)"/>
    </g>

    <!-- Booking confirm bubble above car -->
    <g transform="translate(70, 30)">
      <rect x="3" y="4" width="120" height="36" rx="10" fill="#FFFFFF"/>
      <circle cx="20" cy="22" r="10" fill="#10B981"/>
      <path d="M16 22 L19 25 L24 19" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1F2937">Service Booked</text>
      <text x="34" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B7280">Tomorrow • 10:00 AM</text>
    </g>
  </g>

  <!-- Android phone (right side) -->
  <g transform="translate(355, 35)">
    <!-- Shadow -->
    <rect x="6" y="8" width="220" height="330" rx="22" fill="#000" opacity="0.12"/>
    <!-- Body -->
    <rect width="220" height="330" rx="22" fill="#1F2937"/>
    <!-- Screen -->
    <rect x="6" y="6" width="208" height="318" rx="16" fill="#FFFFFF"/>
    <!-- Camera punch hole -->
    <circle cx="110" cy="16" r="3" fill="#1F2937"/>

    <!-- Status bar -->
    <text x="14" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#1F2937">9:41</text>
    <rect x="190" y="29" width="14" height="8" rx="1.5" fill="#1F2937"/>

    <!-- App header -->
    <text x="14" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#1F2937">Find a Mechanic</text>
    <text x="14" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280">Your vehicle • Toyota Camry 2022</text>

    <!-- Car model match badge -->
    <rect x="14" y="84" width="194" height="38" rx="10" fill="#EFF6FF"/>
    <rect x="22" y="92" width="34" height="22" rx="4" fill="#3B82F6"/>
    <!-- Tiny car -->
    <path d="M26 105 L28 100 L42 100 L44 105 Z M26 105 L44 105 L44 109 L26 109 Z" fill="#FFFFFF"/>
    <circle cx="30" cy="111" r="2" fill="#FFFFFF"/>
    <circle cx="40" cy="111" r="2" fill="#FFFFFF"/>
    <text x="64" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E40AF">Matched 12 mechanics</text>
    <text x="64" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3B82F6">that service your model</text>

    <!-- Mechanic list item 1 -->
    <g transform="translate(14, 132)">
      <rect width="194" height="56" rx="10" fill="#F9FAFB"/>
      <!-- Avatar -->
      <circle cx="22" cy="28" r="14" fill="#FCD9B6"/>
      <path d="M14 22 Q14 14 22 14 Q30 14 30 22 L31 24 L13 24 Z" fill="#1E40AF"/>
      <rect x="13" y="23" width="18" height="2" fill="#1E40AF"/>
      <circle cx="32" cy="38" r="4" fill="#10B981" stroke="#F9FAFB" stroke-width="2"/>
      <!-- Info -->
      <text x="42" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1F2937">Mike's Auto Shop</text>
      <text x="42" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B7280">★ 4.8 • 1.2 mi • Open</text>
      <!-- Price + button -->
      <text x="42" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1F2937">From $89</text>
      <rect x="138" y="36" width="48" height="16" rx="8" fill="#1E40AF"/>
      <text x="162" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">Book</text>
    </g>

    <!-- Mechanic list item 2 -->
    <g transform="translate(14, 196)">
      <rect width="194" height="56" rx="10" fill="#F9FAFB"/>
      <circle cx="22" cy="28" r="14" fill="#D4A574"/>
      <path d="M14 22 Q14 14 22 14 Q30 14 30 22 L31 24 L13 24 Z" fill="#DC2626"/>
      <rect x="13" y="23" width="18" height="2" fill="#DC2626"/>
      <circle cx="32" cy="38" r="4" fill="#10B981" stroke="#F9FAFB" stroke-width="2"/>
      <text x="42" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1F2937">Speedy Service</text>
      <text x="42" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6B7280">★ 4.9 • 2.1 mi • Open</text>
      <text x="42" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1F2937">From $75</text>
      <rect x="138" y="36" width="48" height="16" rx="8" fill="#1E40AF"/>
      <text x="162" y="47" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">Book</text>
    </g>

    <!-- Order tracking strip -->
    <g transform="translate(14, 262)">
      <rect width="194" height="50" rx="10" fill="#1F2937"/>
      <circle cx="20" cy="25" r="9" fill="#FBBF24"/>
      <!-- Truck/wrench icon -->
      <text x="20" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11">🔧</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Track Active Service</text>
      <text x="36" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#FBBF24">Real-time order tracking</text>

      <!-- Progress dots -->
      <circle cx="38" cy="42" r="3" fill="#10B981"/>
      <line x1="42" y1="42" x2="76" y2="42" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="80" cy="42" r="3" fill="#10B981"/>
      <line x1="84" y1="42" x2="118" y2="42" stroke="#FBBF24" stroke-width="1.5"/>
      <circle cx="122" cy="42" r="3" fill="#FBBF24"/>
      <line x1="126" y1="42" x2="160" y2="42" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="2 2"/>
      <circle cx="164" cy="42" r="3" fill="#6B7280"/>
    </g>
  </g>

  <!-- Android badge top-left -->
  <g transform="translate(38, 30)">
    <rect width="100" height="26" rx="13" fill="#FFFFFF"/>
    <circle cx="14" cy="13" r="6" fill="#3DDC84"/>
    <!-- Android antennae -->
    <line x1="11" y1="9" x2="12" y2="11" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="17" y1="9" x2="16" y2="11" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="12" cy="13" r="0.8" fill="#FFFFFF"/>
    <circle cx="16" cy="13" r="0.8" fill="#FFFFFF"/>
    <text x="24" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1F2937">Android App</text>
  </g>

  <!-- Payment gateways badge bottom -->
  <g transform="translate(38, 312)">
    <rect width="280" height="40" rx="12" fill="#FFFFFF"/>
    <text x="14" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#6B7280">19+ PAYMENT GATEWAYS</text>
    <rect x="14" y="22" width="32" height="14" rx="3" fill="#635BFF"/>
    <text x="30" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF">stripe</text>
    <rect x="52" y="22" width="32" height="14" rx="3" fill="#003087"/>
    <text x="68" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" font-style="italic">PayPal</text>
    <rect x="90" y="22" width="32" height="14" rx="3" fill="#1A1F71"/>
    <text x="106" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF">VISA</text>
    <rect x="128" y="22" width="32" height="14" rx="3" fill="#F9FAFB"/>
    <circle cx="138" cy="29" r="4" fill="#EB001B" opacity="0.9"/>
    <circle cx="146" cy="29" r="4" fill="#F79E1B" opacity="0.9"/>
    <rect x="166" y="22" width="32" height="14" rx="3" fill="#1F2937"/>
    <text x="182" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="800" fill="#FFFFFF">Apple Pay</text>
    <rect x="204" y="22" width="32" height="14" rx="3" fill="#4285F4"/>
    <text x="220" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="800" fill="#FFFFFF">G Pay</text>
    <!-- REST API tag -->
    <rect x="244" y="22" width="30" height="14" rx="3" fill="#1F2937"/>
    <text x="259" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="800" fill="#10B981">{ API }</text>
  </g>
</svg>
