<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#D8E2EC"/>

  <!-- Decorative blobs -->
  <circle cx="70" cy="350" r="90" fill="#B8CADE" opacity="0.55"/>
  <circle cx="550" cy="50" r="70" fill="#C5D5E5" opacity="0.6"/>

  <!-- CLIENT (left) -->
  <g transform="translate(50, 130)">
    <!-- Card -->
    <rect x="-4" y="-4" width="160" height="138" rx="16" fill="#000" opacity="0.08"/>
    <rect width="160" height="138" rx="16" fill="#FFFFFF"/>
    <!-- Avatar -->
    <circle cx="40" cy="40" r="22" fill="#FCD9B6"/>
    <path d="M40 32 Q33 32 33 40 Q33 48 40 48 Q47 48 47 40 Q47 32 40 32 Z" fill="#3D2817"/>
    <path d="M22 65 Q22 50 40 50 Q58 50 58 65" fill="#1E40AF"/>
    <!-- Active dot -->
    <circle cx="55" cy="55" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Label -->
    <text x="74" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Sarah K.</text>
    <text x="74" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Client • Verified</text>

    <!-- Job posted -->
    <rect x="12" y="78" width="136" height="48" rx="8" fill="#EFF6FF"/>
    <text x="20" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#1E40AF">JOB POSTED</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#0F172A">Logo &amp; Brand Kit</text>
    <text x="20" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#64748B">$1,200 • 7 days</text>
  </g>

  <!-- ESCROW (center) -->
  <g transform="translate(248, 130)">
    <rect x="-4" y="-4" width="104" height="138" rx="16" fill="#000" opacity="0.08"/>
    <rect width="104" height="138" rx="16" fill="#FFFFFF"/>

    <!-- Vault icon -->
    <rect x="22" y="24" width="60" height="50" rx="8" fill="#1E293B"/>
    <circle cx="52" cy="49" r="14" fill="#334155"/>
    <circle cx="52" cy="49" r="9" fill="#FBBF24"/>
    <rect x="50" y="44" width="4" height="10" fill="#1E293B"/>
    <line x1="52" y1="35" x2="52" y2="39" stroke="#1E293B" stroke-width="2"/>
    <line x1="52" y1="59" x2="52" y2="63" stroke="#1E293B" stroke-width="2"/>
    <line x1="38" y1="49" x2="42" y2="49" stroke="#1E293B" stroke-width="2"/>
    <line x1="62" y1="49" x2="66" y2="49" stroke="#1E293B" stroke-width="2"/>

    <text x="52" y="92" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#1E40AF">ESCROW</text>
    <text x="52" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">$1,200</text>
    <rect x="20" y="115" width="64" height="14" rx="7" fill="#DCFCE7"/>
    <text x="52" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#15803D">● Held safely</text>
  </g>

  <!-- FREELANCER (right) -->
  <g transform="translate(396, 130)">
    <rect x="-4" y="-4" width="160" height="138" rx="16" fill="#000" opacity="0.08"/>
    <rect width="160" height="138" rx="16" fill="#FFFFFF"/>
    <!-- Avatar -->
    <circle cx="40" cy="40" r="22" fill="#D4A574"/>
    <path d="M40 32 Q33 32 33 40 Q33 48 40 48 Q47 48 47 40 Q47 32 40 32 Z" fill="#3D2817"/>
    <path d="M22 65 Q22 50 40 50 Q58 50 58 65" fill="#7C3AED"/>
    <circle cx="55" cy="55" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

    <text x="74" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Marcus D.</text>
    <text x="74" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748B">Designer • ★ 4.9</text>

    <!-- Deliverable -->
    <rect x="12" y="78" width="136" height="48" rx="8" fill="#F5F3FF"/>
    <text x="20" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#7C3AED">DELIVERED</text>
    <text x="20" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#0F172A">brand-kit.zip</text>
    <text x="20" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#64748B">5 files • 12 MB</text>
  </g>

  <!-- Connection arrows -->
  <!-- Client → Escrow -->
  <g>
    <path d="M214 200 Q234 200 244 200" stroke="#1E40AF" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <polygon points="244,200 238,196 238,204" fill="#1E40AF"/>
    <text x="218" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1E40AF">Pay</text>
  </g>
  <!-- Freelancer → Escrow (delivery) -->
  <g>
    <path d="M392 200 Q372 200 360 200" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <polygon points="360,200 366,196 366,204" fill="#7C3AED"/>
    <text x="360" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#7C3AED">Deliver</text>
  </g>

  <!-- Chat bubble overlay (top) -->
  <g transform="translate(190, 50)">
    <rect x="4" y="4" width="220" height="56" rx="14" fill="#000" opacity="0.08"/>
    <rect width="220" height="56" rx="14" fill="#FFFFFF"/>
    <!-- Mini avatars -->
    <circle cx="22" cy="28" r="11" fill="#FCD9B6"/>
    <circle cx="38" cy="28" r="11" fill="#D4A574" stroke="#FFFFFF" stroke-width="2"/>
    <text x="58" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A">Real-time chat</text>
    <circle cx="155" cy="22" r="3" fill="#10B981"/>
    <text x="161" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#64748B">live</text>
    <!-- Mini chat lines -->
    <rect x="58" y="32" width="100" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="58" y="42" width="70" height="6" rx="3" fill="#E5E7EB"/>
  </g>

  <!-- Step badges along top -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <g transform="translate(40, 30)">
      <circle cx="14" cy="14" r="14" fill="#1E40AF"/>
      <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">1</text>
      <text x="34" y="18" font-size="10" font-weight="600" fill="#1E293B">Post</text>
    </g>
    <g transform="translate(456, 30)">
      <circle cx="14" cy="14" r="14" fill="#7C3AED"/>
      <text x="14" y="18" text-anchor="middle" font-size="11" font-weight="800" fill="#FFFFFF">2</text>
      <text x="34" y="18" font-size="10" font-weight="600" fill="#1E293B">Bid</text>
    </g>
  </g>

  <!-- Bottom status pill -->
  <g transform="translate(200, 295)">
    <rect width="200" height="32" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="18" cy="16" r="6" fill="#10B981"/>
    <path d="M15 16 L17 18 L21 14" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="32" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F172A">Project completed • Funds released</text>
  </g>
</svg>
