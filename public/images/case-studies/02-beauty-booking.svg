<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#EDE5DA"/>

  <!-- Soft decorative shapes -->
  <circle cx="80" cy="80" r="80" fill="#E0D2BD" opacity="0.6"/>
  <circle cx="540" cy="350" r="100" fill="#D9C9B0" opacity="0.5"/>

  <!-- Beauty room illustration (left side) -->
  <g transform="translate(40, 100)">
    <!-- Floor -->
    <rect x="0" y="180" width="220" height="40" fill="#C9B89C" opacity="0.5"/>
    <!-- Back wall -->
    <rect x="0" y="0" width="220" height="180" fill="#F5EFE5"/>
    <!-- Window -->
    <rect x="20" y="20" width="60" height="80" rx="4" fill="#F8E8C8"/>
    <line x1="50" y1="20" x2="50" y2="100" stroke="#D9C9B0" stroke-width="1.5"/>
    <line x1="20" y1="60" x2="80" y2="60" stroke="#D9C9B0" stroke-width="1.5"/>

    <!-- Treatment bed -->
    <rect x="40" y="135" width="160" height="22" rx="6" fill="#FFFFFF"/>
    <rect x="40" y="135" width="40" height="22" rx="6" fill="#F4D5B8"/>
    <rect x="40" y="153" width="160" height="32" fill="#E8A87C"/>
    <rect x="55" y="185" width="6" height="20" fill="#8B6F4E"/>
    <rect x="179" y="185" width="6" height="20" fill="#8B6F4E"/>

    <!-- Pillow -->
    <ellipse cx="60" cy="138" rx="20" ry="6" fill="#FFFFFF"/>

    <!-- Plant -->
    <rect x="170" y="105" width="24" height="22" rx="3" fill="#A87B5A"/>
    <ellipse cx="178" cy="100" rx="6" ry="10" fill="#7A9B6E"/>
    <ellipse cx="186" cy="98" rx="6" ry="12" fill="#86A878"/>
    <ellipse cx="182" cy="92" rx="5" ry="9" fill="#6F8C63"/>

    <!-- Wall art / mirror -->
    <rect x="110" y="35" width="50" height="60" rx="25" fill="#F4D5B8" stroke="#C9A782" stroke-width="2"/>

    <!-- Smart lock on door (right edge) -->
    <rect x="195" y="60" width="22" height="40" rx="3" fill="#2D2D2D"/>
    <circle cx="206" cy="78" r="5" fill="#10B981"/>
    <rect x="201" y="88" width="10" height="3" rx="1" fill="#10B981"/>
  </g>

  <!-- Phone mockup with date picker & payment (right side) -->
  <g transform="translate(310, 30)">
    <!-- Phone shadow -->
    <rect x="6" y="8" width="240" height="345" rx="28" fill="#000" opacity="0.12"/>
    <!-- Phone body -->
    <rect width="240" height="345" rx="28" fill="#FFFFFF"/>
    <!-- Notch -->
    <rect x="95" y="10" width="50" height="14" rx="7" fill="#2D2D2D"/>

    <!-- App header -->
    <text x="20" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#3D2817">Book Treatment</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9C8B73">Glow Room • Downtown</text>

    <!-- Date picker label -->
    <text x="20" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7A6850">SELECT DATE</text>

    <!-- Mini calendar -->
    <rect x="20" y="108" width="200" height="100" rx="10" fill="#FAF5ED"/>
    <text x="30" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#3D2817">May 2026</text>
    <text x="186" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A87B5A">›</text>

    <!-- Day labels -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#9C8B73">
      <text x="32" y="140">M</text>
      <text x="56" y="140">T</text>
      <text x="80" y="140">W</text>
      <text x="104" y="140">T</text>
      <text x="128" y="140">F</text>
      <text x="152" y="140">S</text>
      <text x="176" y="140">S</text>
    </g>
    <!-- Date cells row 1 -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3D2817">
      <text x="31" y="156">12</text>
      <text x="55" y="156">13</text>
      <text x="79" y="156">14</text>
      <text x="103" y="156">15</text>
      <text x="127" y="156">16</text>
      <text x="151" y="156">17</text>
      <text x="175" y="156">18</text>
    </g>
    <!-- Date cells row 2 with selected -->
    <circle cx="106" cy="178" r="11" fill="#C97B5C"/>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3D2817">
      <text x="31" y="182">19</text>
      <text x="55" y="182">20</text>
      <text x="79" y="182">21</text>
    </g>
    <text x="103" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">22</text>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3D2817">
      <text x="127" y="182">23</text>
      <text x="151" y="182">24</text>
      <text x="175" y="182">25</text>
    </g>

    <!-- Time slot -->
    <text x="20" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7A6850">TIME SLOT</text>
    <rect x="20" y="234" width="55" height="24" rx="12" fill="#FFFFFF" stroke="#E0D2BD" stroke-width="1"/>
    <text x="34" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7A6850">10:00</text>
    <rect x="82" y="234" width="55" height="24" rx="12" fill="#C97B5C"/>
    <text x="93" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">11:30</text>
    <rect x="144" y="234" width="55" height="24" rx="12" fill="#FFFFFF" stroke="#E0D2BD" stroke-width="1"/>
    <text x="158" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7A6850">14:00</text>

    <!-- Payment method -->
    <text x="20" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#7A6850">PAYMENT</text>
    <rect x="20" y="286" width="200" height="32" rx="8" fill="#FAF5ED"/>
    <rect x="28" y="294" width="22" height="16" rx="3" fill="#635BFF"/>
    <text x="36" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF">VISA</text>
    <text x="58" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#3D2817">•••• 4521</text>
    <text x="58" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#9C8B73">Stripe secured</text>
    <circle cx="208" cy="302" r="7" fill="#10B981"/>
    <path d="M205 302 L207 304 L211 300" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- Confirm button -->
    <rect x="20" y="328" width="200" height="8" rx="4" fill="#3D2817"/>
  </g>

  <!-- Decorative sparkles -->
  <g fill="#C97B5C" opacity="0.6">
    <path d="M280 90 L283 96 L289 99 L283 102 L280 108 L277 102 L271 99 L277 96 Z"/>
  </g>
  <g fill="#A87B5A" opacity="0.5">
    <path d="M40 270 L42 274 L46 276 L42 278 L40 282 L38 278 L34 276 L38 274 Z"/>
  </g>
</svg>
